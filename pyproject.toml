[project]
name = "ragdoc"
version = "0.2.0"
description = "Agentic RAG over documents: contextual hybrid retrieval, reranking, self-correcting agent loop, citations and evaluation."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Abhimanyu Singh" }]
keywords = ["rag", "agentic-rag", "llm", "retrieval", "langgraph", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "tiktoken>=0.7",
    "openai>=1.40",
    "anthropic>=0.40",
    "langgraph>=0.2.60",
    "qdrant-client>=1.10",
    "rank-bm25>=0.2.2",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Layout-aware PDF parsing with tables (recommended; large install).
docling = ["docling>=2.5"]
# Local embeddings and cross-encoder reranking.
local = ["sentence-transformers>=3.0"]
cohere = ["cohere>=5.5"]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
ui = ["gradio>=4.40"]
mcp = ["mcp>=1.2"]
tracing = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
all = ["ragdoc[docling,local,cohere,api,ui,mcp,tracing]"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
ragdoc = "ragdoc.cli:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragdoc"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs API keys and network (deselected in CI)"]
