# ragdoc default configuration. Secrets never go here: put API keys in .env.
# Any value can be overridden with an env var: RAGDOC__<SECTION>__<KEY>, e.g.
#   RAGDOC__RETRIEVAL__RERANKER=none

index_dir: .ragdoc            # where the index, caches and manifests live
collection: default           # one collection per corpus

llm:
  provider: openai            # openai | anthropic | openai_compatible (Ollama, vLLM, LM Studio...)
  base_url: null              # only for openai_compatible, e.g. http://localhost:11434/v1
  # Models per role: small/cheap for routing and grading, strong for answering.
  fast_model: gpt-5-mini
  strong_model: gpt-5
  vision_model: null          # null = strong_model; must accept image input
  temperature: null           # null = provider default (reasoning models reject custom values)
  max_output_tokens: 2048
  request_timeout_s: 60
  max_retries: 3

embeddings:
  provider: openai            # openai | openai_compatible | local (sentence-transformers)
  model: text-embedding-3-small
  base_url: null
  batch_size: 128
  dimensions: null            # optional truncation for text-embedding-3-* models

ingestion:
  parser: auto                # auto (docling if installed, else pypdf) | docling | pypdf
  chunk_tokens: 600
  chunk_overlap_tokens: 80
  min_chunk_tokens: 40
  contextualize: true         # Anthropic-style contextual retrieval headers (one LLM call per chunk)
  context_max_doc_tokens: 60000   # document text passed to the contextualizer is truncated to this
  raptor: false               # build a summary tree for whole-document questions
  raptor_group_size: 6
  redact_pii: false
  doc_summary: false          # one summary vector per document (required for retrieval.doc_routing)
  workers: 8                  # parallel LLM calls per document / documents per batch

retrieval:
  vector_store: qdrant        # qdrant | memory (numpy, for tests and tiny corpora)
  qdrant_url: null            # null = embedded local Qdrant in index_dir; or http://localhost:6333
  mode: hybrid                # dense | bm25 | hybrid
  dense_k: 60
  bm25_k: 60
  rrf_k: 60
  fused_k: 40                 # candidates passed to the reranker
  reranker: llm               # none | llm | cross_encoder | cohere
  cross_encoder_model: BAAI/bge-reranker-v2-m3
  cohere_model: rerank-v3.5
  final_k: 8                  # chunks that reach the generator
  # --- scale (millions of chunks) ---
  lexical: memory             # memory (in-process BM25, <~100k chunks) | qdrant_sparse (server-side BM25 + RRF)
  quantization: none          # none | int8 (4x less RAM for vectors, tiny recall cost)
  on_disk: false              # keep vectors on disk (Qdrant mmap)
  doc_routing: false          # 2-stage: pick top documents by summary, then search their chunks
  doc_routing_top_docs: 50

agent:
  enabled: true               # false = plain single-pass hybrid RAG (the baseline)
  # Routes the router may choose; drop ones you don't need (e.g. no graph → remove relational/global).
  routes: [simple, multi_hop, global, relational, structured, code]
  max_rewrites: 2             # rewrite-and-retry rounds before abstaining
  max_sub_questions: 4
  min_relevant_chunks: 1      # chunks graded >= relevance_threshold needed to proceed
  relevance_threshold: 2      # UMBRELA-style 0-3 scale
  verify_answers: true
  max_revisions: 1
  use_hyde: true

cache:
  answers: true
  embeddings: true

tracing:
  otlp_endpoint: null         # e.g. http://localhost:3000/api/public/otel (Langfuse) or Phoenix's /v1/traces
  service_name: ragdoc

multimodal:
  describe_images: true       # VLM description + OCR for figures and video keyframes
  chart_to_table: true        # charts → approximate data table, queryable with SQL
  min_image_px: 120           # skip icons and logos
  max_images_per_doc: 200
  image_embeddings: false     # CLIP vectors for text→image search (pip install ragdoc[local])
  image_embedding_model: clip-ViT-B-32
  answer_with_images: true    # send the top figures to the (vision) generator
  max_answer_images: 3

tables:
  merge_multipage: true       # stitch tables split across page breaks
  rows_per_chunk: 40          # large tables are chunked by row groups, header repeated
  sql: true                   # load tables into SQLite for aggregate / numeric questions
  max_sql_rows: 200

media:
  transcriber: openai         # openai (whisper-1, timestamped segments) | local (faster-whisper)
  transcription_model: whisper-1
  local_whisper_model: small
  language: null
  window_seconds: 90          # transcript chunk length
  keyframe_interval_s: 30     # video frames sampled for VLM captions
  keyframe_scene_threshold: null   # e.g. 0.3 to sample on scene changes instead
  max_keyframes: 120

code:
  max_file_bytes: 1000000
  symbol_max_lines: 150       # longer functions/classes are split into overlapping windows
  window_overlap_lines: 15
  services: true              # detect microservices and build the service dependency graph
  summarize_services: true

graph:
  enabled: false              # GraphRAG: one extraction call per chunk at ingestion
  store: sqlite               # sqlite (local) | neo4j (scale; set neo4j_uri + NEO4J_PASSWORD)
  neo4j_uri: null
  neo4j_user: neo4j
  entity_types: [person, organization, location, product, technology, concept, event, metric, document]
  local_top_entities: 10
  max_hops: 1
  max_relations: 40
  community_max_size: 40
  community_min_size: 3
  global_top_communities: 12
