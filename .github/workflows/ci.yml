name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,api]"
      - name: Lint
        run: ruff check src tests eval
      - name: Type check
        run: mypy src
        continue-on-error: true  # informational until the codebase is fully typed
      - name: Tests (offline, scripted models)
        run: pytest --cov=ragdoc --cov-report=term-missing -m "not integration"

  smoke-eval:
    # Runs the first 10 golden questions against real models when the secret is configured.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Smoke eval
        if: env.OPENAI_API_KEY != '' && hashFiles('eval/datasets/golden.jsonl') != '' && hashFiles('eval/datasets/docs/**') != ''
        run: ragdoc eval --limit 10 --no-judge
