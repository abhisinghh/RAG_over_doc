# API + Qdrant server + Neo4j (graph) + Arize Phoenix (trace viewer at http://localhost:6006).
#   docker compose -f docker/docker-compose.yml up --build
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    environment:
      RAGDOC__RETRIEVAL__QDRANT_URL: http://qdrant:6333
      RAGDOC__TRACING__OTLP_ENDPOINT: http://phoenix:6006/v1/traces
      RAGDOC__RETRIEVAL__LEXICAL: qdrant_sparse
      RAGDOC__GRAPH__STORE: neo4j
      RAGDOC__GRAPH__NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-ragdoc-dev-password}
    ports:
      - "8000:8000"
    volumes:
      - ragdoc-data:/data
    depends_on:
      - qdrant
      - neo4j
      - phoenix

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-ragdoc-dev-password}
      NEO4J_PLUGINS: '["graph-data-science"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"

volumes:
  ragdoc-data:
  qdrant-data:
  neo4j-data:
