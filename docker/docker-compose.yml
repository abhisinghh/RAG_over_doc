# API + Qdrant server + Arize Phoenix (trace viewer at http://localhost:6006).
#   docker compose -f docker/docker-compose.yml up --build
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    environment:
      RAGDOC__RETRIEVAL__QDRANT_URL: http://qdrant:6333
      RAGDOC__TRACING__OTLP_ENDPOINT: http://phoenix:6006/v1/traces
    ports:
      - "8000:8000"
    volumes:
      - ragdoc-data:/data
    depends_on:
      - qdrant
      - phoenix

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"

volumes:
  ragdoc-data:
  qdrant-data:
